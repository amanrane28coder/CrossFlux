name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-dev python3-venv \
            libboost-all-dev libssl-dev nlohmann-json3-dev
      - name: Create Python environment
        run: python3 -m venv .venv
      - name: Install pinned Python dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Build C++ engine and simulated trading executable
        run: |
          PYBIND11_CMAKE_DIR="$($GITHUB_WORKSPACE/.venv/bin/python -m pybind11 --cmakedir)"
          cmake -S . -B build/ci \
            -DCROSSFLUX_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build/artifacts" \
            -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python" \
            -Dpybind11_DIR="$PYBIND11_CMAKE_DIR"
          cmake --build build/ci --parallel 2
      - name: Run Python suite against the built extension
        env:
          PYTHONPATH: ${{ github.workspace }}/build/artifacts:${{ github.workspace }}
        run: .venv/bin/python -m pytest -q

# CI configuration for CrossFlux - updated for reliability
