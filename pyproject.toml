[project]
name = "crossflux-research"
version = "0.1.0"
description = "Cross-venue market-data research and execution simulation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "certifi==2026.7.22",
    "matplotlib==3.10.9",
    "numpy==2.4.4",
    "pandas==2.3.3",
    "plotly==6.9.0",
    "scipy==1.18.0",
    "streamlit==1.59.2",
    "streamlit-autorefresh==1.0.1",
    "websockets==13.0",
    "yfinance==1.5.2",
]

[project.optional-dependencies]
history = ["tardis-dev==4.2.1"]
native-build = ["pybind11==3.0.4"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
